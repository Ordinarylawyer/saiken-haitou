name: 改善の提案
description: 対応する場面の追加、画面・配当表・Excel・印刷の改善などを提案する
title: "[提案] "
labels: ["機能追加"]
body:
  - type: markdown
    attributes:
      value: |
        事件の当事者名・事件番号など、個別の事件を特定できる情報は書かないでください。
  - type: textarea
    id: proposal
    attributes:
      label: 提案の内容
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・使う場面
  - type: textarea
    id: source
    attributes:
      label: 根拠（計算の規則にかかわるとき）
      description: 条文・判例・文献（頁）などと、確認した日
