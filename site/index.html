<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 入力を外に出さないための約束: 外部との通信（fetch・XHR・WebSocket 等）を禁止し、読み込むのはこのサイトのファイルだけにする -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>債権執行 配当計算</title>
<meta name="description" content="債権執行の配当額を計算し、配当表（弁済金交付計算書）を作ります。ブラウザの中だけで動き、入力した情報をどこにも送りません。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="brand">債権執行 配当計算</div>
  <div class="right noprint">
    <a class="btn light" href="https://github.com/Ordinarylawyer/saiken-haitou/blob/main/docs/%E8%AB%96%E7%82%B9%E6%95%B4%E7%90%86.md" target="_blank" rel="noopener noreferrer" title="論点ごとの結論・根拠（条文・判例・文献）・設例">計算の考え方</a>
    <button class="btn light" data-act="load">JSON を読み込む</button>
    <button class="btn light" data-act="save">JSON に保存</button>
    <button class="btn light" data-act="clear">すべて消す</button>
    <input type="file" id="loadfile" accept=".json,application/json" hidden>
  </div>
</header>
<p class="privacy">入力した情報はこのブラウザの中だけで扱います。サーバーへの送信・保存も、サーバーからのデータの取得もしません（閉じると消えます）。続きをするときは「JSON に保存」で手元に保存し、「JSON を読み込む」で戻します。</p>
<main class="layout">
  <div id="form" class="form-col"><noscript>JavaScript を有効にしてください。</noscript></div>
  <div class="result-col"><section class="card result"><h2>配当表</h2><div id="result"></div></section></div>
</main>
